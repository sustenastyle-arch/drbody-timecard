<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timecard Persistent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Time Clock</h1>
    <p>Persistent timecard with Netlify Functions backend.</p>
  </header>

  <section class="config">
    <label>Netlify function URL (e.g. https://your-site.netlify.app/.netlify/functions)</label>
    <input id="apiRoot" type="text" value="https://YOUR_NETLIFY_SITE.netlify.app/.netlify/functions" />
    <small>Set this URL to enable backend storage.</small>
  </section>

  <section class="pin-config">
    <h2>暗証番号設定</h2>
    <p>各スタッフは4桁の暗証番号を設定してください。設定後、タイムイン／タイムアウト時に入力が必要になります。</p>
    <div id="pinConfig"></div>
  </section>

  <section class="status">
    <div id="message">Loading...</div>
  </section>

  <section class="grid" id="employeeGrid"></section>

  <section class="filters">
    <div class="filter-row">
      <label>開始日</label>
      <input id="filterFrom" type="date" />
    </div>
    <div class="filter-row">
      <label>終了日</label>
      <input id="filterTo" type="date" />
    </div>
    <div class="filter-row action-row">
      <button id="applyFilter" class="secondary">フィルタ適用</button>
      <button id="resetFilter" class="secondary">リセット</button>
    </div>
  </section>

  <section class="action-row">
    <button id="loadBackend">バックエンド履歴を読み込む</button>
    <button id="downloadCsv">CSVをダウンロード</button>
    <button id="saveBackendAll" class="secondary">全件バックエンド保存</button>
  </section>

  <section>
    <h2>History</h2>
    <table id="historyTable"></table>
    <pre id="historyOutput"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
