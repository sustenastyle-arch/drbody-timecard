<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timecard Persistent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Time Clock</h1>
    <p>Persistent timecard with Netlify Functions backend.</p>
  </header>

  <section class="config">
    <label>Netlify function URL (e.g. https://your-site.netlify.app/.netlify/functions)</label>
    <input id="apiRoot" type="text" value="https://YOUR_NETLIFY_SITE.netlify.app/.netlify/functions" />
    <small>Set this URL to enable backend storage.</small>
  </section>

  <section class="status">
    <div id="message">Loading...</div>
  </section>

  <section class="grid" id="employeeGrid"></section>

  <section class="action-row">
    <button id="loadBackend">Load backend history</button>
    <button id="downloadCsv">Download CSV</button>
  </section>

  <section>
    <h2>History</h2>
    <pre id="historyOutput"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
