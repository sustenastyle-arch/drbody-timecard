<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timecard Persistent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Time Clock</h1>
    <p>GitHub Pages フロント + Netlify Functions バックエンドで履歴を永続化します。</p>
  </header>

  <section class="config">
    <label>Netlify 関数 URL（例：https://your-site.netlify.app/.netlify/functions）</label>
    <input id="apiRoot" type="text" value="https://YOUR_NETLIFY_SITE.netlify.app/.netlify/functions" />
    <small>この URL を設定すると、バックエンド保存が有効になります。</small>
  </section>

  <section class="status">
    <div id="message">読み込み中...</div>
  </section>

  <section class="grid" id="employeeGrid"></section>

  <section class="action-row">
    <button id="loadBackend">バックエンド履歴を読み込む</button>
    <button id="downloadCsv">CSV でダウンロード</button>
  </section>

  <section>
    <h2>履歴</h2>
    <pre id="historyOutput"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
